name: Deploy Horizon source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor == 'Coneys-Network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Expand Horizon source
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile("Horizon-source.zip") as archive:
              for entry in archive.infolist():
                  target = Path("staging") / entry.filename.replace("\\", "/").lstrip("/")
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          PY
          cp -a staging/Horizon/. .
          rm -rf staging Horizon-source.zip .github/workflows/bootstrap.yml .github/workflows/bootstrap-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Horizon source"
          git push
